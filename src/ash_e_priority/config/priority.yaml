# ash_e_priority parameters (spec 8). `/**` matches whatever the node is called. Core keys == PriorityConfig fields
# (test_priority_params checks this). Same values as prototype/config/priority.yaml. Tune in the field, e.g.
#   ros2 param set /ash_e/priority switch_margin 0.3     (applies from the next evaluation, target is kept)
/**:
  ros__parameters:
    w_state: 0.35
    w_dist: 0.3
    w_conf: 0.1
    w_center: 0.1
    w_stay: 0.15
    holding_value: 0.7
    near_m: 1.5
    far_m: 5.0
    acquire_range_m: 5.0
    release_range_m: 5.8
    out_of_range_hold_s: 1.0
    min_state_conf: 0.4
    hfov_deg: 70.0
    stay_full_s: 10.0
    switch_margin: 0.15
    min_hold_s: 3.0
    switch_confirm_s: 1.0
    lost_timeout_s: 2.0
    state_cleared_s: 5.0
    input_timeout_s: 1.0
    cooldown_lost_s: 10.0
    cooldown_out_of_range_s: 30.0
    cooldown_state_cleared_s: 30.0
    cooldown_done_s: 600.0
    cooldown_refused_s: 300.0
    cooldown_aborted_s: 60.0
    spatial_cooldown_enable: true
    spatial_cooldown_radius_m: 1.0
    spatial_cooldown_bearing_deg: 5.0
    # wrapper-only keys
    tick_rate_hz: 10.0          # input-timeout watchdog only; evaluation happens per /ash_e/detections message
    time_jump_reset_s: 1.0      # input stamp earlier than the previous by more than this -> selector reset (bag loop)
    publish_markers: true
    marker_max_candidates: 5
    marker_lifetime_s: 1.0
